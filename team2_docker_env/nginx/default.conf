# Serves the Great Expectations Data Docs site (generated by the ingestion DAG's checkpoint).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # used by the docker healthcheck (works even before the first report exists)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # reports are regenerated by Airflow -> never serve a stale cached copy
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
