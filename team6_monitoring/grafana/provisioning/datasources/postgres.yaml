apiVersion: 1
datasources:
  - name: DSP PostgreSQL
    uid: dsp-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: ${POSTGRES_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
