  - uid: ml-positive-rate-shift
    title: 'ML: positive-prediction rate far from training baseline'
    condition: C
    for: 0s
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 1200
