        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.01
        datasource:
          type: __expr__
          uid: __expr__
    annotations:
      summary: Predicted probabilities have (almost) no variation in the last 10 minutes
      description: 'Standard deviation of prediction_proba < 0.01 over >= 20 predictions: the model collapsed to a single outcome or inputs are degenerate.'
    labels:
