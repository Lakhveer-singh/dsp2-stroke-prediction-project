        editorMode: code
        format: time_series
        rawQuery: true
        rawSql: "SELECT NOW() AS time,\n       ABS(AVG(prediction)::float\n           - (SELECT proportion FROM training_stats WHERE is_baseline AND feature_name = 'prediction')) AS value\nFROM predictions\n\
          WHERE prediction_time > NOW() - INTERVAL '15 minutes'\nHAVING COUNT(*) >= 20"
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        datasource:
          type: __expr__
