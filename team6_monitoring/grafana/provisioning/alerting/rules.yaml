- orgId: 1
  name: ml-monitoring
  folder: DSP Alerts
  interval: 1m
  rules:
  - uid: ml-numeric-drift
    title: 'ML: significant numerical drift vs training baseline'
    condition: C
    for: 0s
    noDataState: OK
    execErrState: OK
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 1200
        to: 0
      datasourceUid: dsp-postgres
      model:
        refId: A
        datasource: *id001
        editorMode: code
        format: time_series
        rawQuery: true
        rawSql: "WITH b AS (\n  SELECT feature_name, mean, std FROM training_stats WHERE is_baseline AND feature_type = 'numerical'\n), s AS (\n  SELECT COUNT(*)::float AS n, AVG(age) AS age, AVG(avg_glucose_level)\
          \ AS avg_glucose_level, AVG(bmi) AS bmi\n  FROM predictions\n  WHERE prediction_time > NOW() - INTERVAL '15 minutes'\n)\nSELECT NOW() AS time,\n       GREATEST(ABS(s.age - (SELECT mean FROM b\
          \ WHERE feature_name = 'age'))\n                / NULLIF((SELECT std FROM b WHERE feature_name = 'age') / SQRT(s.n), 0),\n               ABS(s.avg_glucose_level - (SELECT mean FROM b WHERE feature_name\
          \ = 'avg_glucose_level'))\n                / NULLIF((SELECT std FROM b WHERE feature_name = 'avg_glucose_level') / SQRT(s.n), 0),\n               ABS(s.bmi - (SELECT mean FROM b WHERE feature_name\
          \ = 'bmi'))\n                / NULLIF((SELECT std FROM b WHERE feature_name = 'bmi') / SQRT(s.n), 0)) AS value\nFROM s\nWHERE s.n >= 15"
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
        datasource:
          type: __expr__
          uid: __expr__
    annotations:
      summary: A numerical feature mean drifted (z-score > 3) over the last 15 minutes
      description: The largest z-score of age / avg_glucose_level / bmi (serving mean vs the champion's training baseline) is above 3 with >= 15 predictions. Consider retraining.
    labels:
      team: ml
      severity: critical
  - uid: ml-constant-predictions
