# Routing: alert rules carry a `team` label.
#   team=data_quality -> "Data Quality Alerts" channel
#   team=ml           -> "ML Alerts" channel
apiVersion: 1
policies:
  - orgId: 1
    receiver: teams-data-quality
    group_by: ['grafana_folder', 'alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 30m
    routes:
      - receiver: teams-data-quality
        object_matchers:
          - ['team', '=', 'data_quality']
      - receiver: teams-ml
        object_matchers:
          - ['team', '=', 'ml']
